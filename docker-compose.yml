services:
  kikoto:
    image: ${KIKOTO_IMAGE:-yexca/kikoto:latest}
    restart: unless-stopped
    # Keep this longer than KIKOTO_SHUTDOWN_TIMEOUT_SECONDS so a stop can
    # drain requests and release running jobs before Docker sends SIGKILL.
    stop_grace_period: 30s
    environment:
      KIKOTO_MODE: ${KIKOTO_MODE:-production}
      KIKOTO_ROOT_USERNAME: ${KIKOTO_ROOT_USERNAME:-root}
      KIKOTO_ROOT_PASSWORD: ${KIKOTO_ROOT_PASSWORD:?KIKOTO_ROOT_PASSWORD must be set}
      KIKOTO_HTTP_ADDR: ${KIKOTO_HTTP_ADDR:-0.0.0.0:7659}
      KIKOTO_DB_PATH: ${KIKOTO_DB_PATH:-/config/kikoto.db}
      KIKOTO_DATA_ROOT: ${KIKOTO_DATA_ROOT:-/data}
      KIKOTO_CACHE_ROOT: ${KIKOTO_CACHE_ROOT:-/cache}
      KIKOTO_STATIC_DIR: ${KIKOTO_STATIC_DIR:-/app/static}
      KIKOTO_LOCAL_SCAN_DEPTH: ${KIKOTO_LOCAL_SCAN_DEPTH:-3}
      KIKOTO_SESSION_COOKIE_SECURE: ${KIKOTO_SESSION_COOKIE_SECURE:-false}
      KIKOTO_ALLOWED_ORIGINS: ${KIKOTO_ALLOWED_ORIGINS:-}
      KIKOTO_TRUSTED_PROXIES: ${KIKOTO_TRUSTED_PROXIES:-}
      KIKOTO_LOGIN_CONCURRENCY: ${KIKOTO_LOGIN_CONCURRENCY:-8}
      KIKOTO_SHUTDOWN_TIMEOUT_SECONDS: ${KIKOTO_SHUTDOWN_TIMEOUT_SECONDS:-20}
      KIKOTO_REMOTE_SOURCES_ENABLED: ${KIKOTO_REMOTE_SOURCES_ENABLED:-false}
    ports:
      - "7655:7659"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./data:/data
