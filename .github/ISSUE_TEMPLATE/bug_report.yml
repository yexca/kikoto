name: Bug report
description: Report a reproducible problem with Kikoto.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe one reproducible problem. You can write in any language.
        Do not attach real databases, media, source URLs, credentials, or personal paths, and redact them from diagnostics and screenshots.
        Work codes can stay: when the problem concerns specific works, their codes help reproduce it.
        Report suspected vulnerabilities through [private security reporting](https://github.com/yexca/kikoto/security/advisories/new).
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private data from the report and attachments.
          required: true
  - type: textarea
    id: version
    attributes:
      label: Version info
      description: >-
        Open **About** from the account menu, select the copy button beside the version number, and paste the
        result here; it lists the app, server, and browser versions. Do this in each app the problem appears in.
        If Kikoto does not open, give the `version` that `/health` on your server reports, such as
        `http://127.0.0.1:7655/health`. An image tag such as `latest` does not identify a version.
      placeholder: |
        Kikoto vX.Y.Z (Web)
        Server vX.Y.Z
        Mozilla/5.0 ...
      render: text
    validations:
      required: true
  - type: input
    id: previous-version
    attributes:
      label: Last version without the problem
      description: If the problem started after an upgrade, the version you upgraded from.
      placeholder: "vX.Y.Z, or unknown"
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      multiple: true
      options:
        - Web application
        - Android client
        - iOS client
        - Server or workflow (scan, Fetch, metadata sync)
        - Docker deployment
        - Windows installation helper
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        How Kikoto runs and where the library lives; the version info already names the browser. Include settings
        you changed from the defaults, such as the scan depth or a proxy. Omit private addresses and paths.
      placeholder: |
        Deployment: Docker Compose on a NAS, Linux x86_64
        Library: two storage pools on local disks, one remote source
        Changed settings: scan depth 5
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >-
        Include the starting state and exact actions, including how the affected works reached the library, such as
        a local scan or a Fetch from a remote source. If the problem occurs only with certain works, give their work
        codes, such as RJ00000000.
      placeholder: |
        1. Start with ...
        2. Open ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: >-
        Include error messages and how many works or files the problem affects. Screenshots help; crop out paths,
        server addresses, and anything else you consider private.
    validations:
      required: true
  - type: textarea
    id: workflow-log
    attributes:
      label: Workflow run log
      description: >-
        For a problem with a scan, Fetch, metadata sync, or another workflow run: open **Workflows**, select the run,
        expand **Diagnostic log**, select **Copy log**, and paste it here. Work codes in the log can stay; replace
        private paths and source addresses before posting.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Other diagnostics
      description: >-
        Optional server log excerpts from `docker compose logs kikoto`, browser console errors, or, in the Android or
        iOS app, **Copy diagnostics** from the account menu's **Server** view, which includes your server address and
        user name. Review everything for credentials, private endpoints, and paths before posting.
      render: text
