name: Set up Node
description: Install the Node version pinned in frontend/package.json.
inputs:
  cache:
    description: Restore the npm download cache keyed by the frontend lockfile.
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: frontend/package.json
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: frontend/package-lock.json
        package-manager-cache: false
