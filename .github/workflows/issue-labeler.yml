name: Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label issue content
    if: github.repository == 'yexca/kikoto'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Label from issue content
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          include-title: 1
          include-body: 1
          repo-token: ${{ github.token }}
