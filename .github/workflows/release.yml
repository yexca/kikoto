name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: kikoto

jobs:
  verify_release:
    name: Verify release source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag and version
        id: version
        shell: bash
        run: |
          expected_version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $expected_version." >&2
            exit 1
          fi
          echo "version_name=${expected_version#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release notes
        shell: bash
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi

      - name: Wait for successful main CI for this commit
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100"
          deadline=$((SECONDS + 1800))

          while true; do
            # The single-quoted program contains jq variables, not shell variables.
            # shellcheck disable=SC2016
            state="$(gh api "$runs_api" --jq '
              [.workflow_runs[] | select(.head_branch == "main")] as $runs
              | if any($runs[]; .status == "completed" and .conclusion == "success") then "success"
                elif any($runs[]; .status != "completed") then "waiting"
                elif ($runs | length) > 0 then "failed"
                else "missing"
                end
            ')"

            case "$state" in
              success)
                echo "Successful main CI found for commit $GITHUB_SHA."
                break
                ;;
              failed)
                echo "Main CI failed for commit $GITHUB_SHA:" >&2
                gh api "$runs_api" --jq '
                  .workflow_runs[]
                  | select(.head_branch == "main")
                  | "\(.html_url) status=\(.status) conclusion=\(.conclusion)"
                ' >&2
                exit 1
                ;;
              waiting)
                echo "Main CI for commit $GITHUB_SHA is still running; checking again in 60 seconds."
                ;;
              missing)
                echo "Main CI for commit $GITHUB_SHA is not visible yet; checking again in 60 seconds."
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for successful main CI for commit $GITHUB_SHA." >&2
              exit 1
            fi
            sleep 60
          done

  build_and_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs:
      - verify_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Kikoto
            org.opencontainers.image.description=Local-first personal audio library

      - name: Build and push production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  build_apk:
    name: Build and upload APK
    runs-on: ubuntu-24.04
    needs:
      - verify_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set release version
        run: |
          echo "KIKOTO_VERSION_NAME=${{ needs.verify_release.outputs.version_name }}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
          verify-signature: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --strict-allow-scripts

      - name: Sync Android web assets
        working-directory: frontend
        run: npm run cap:sync

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets are required for release APK signing." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kikoto-release.keystore"
          echo "KIKOTO_KEYSTORE_FILE=$RUNNER_TEMP/kikoto-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          KIKOTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIKOTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIKOTO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --dependency-verification strict assembleRelease

      - name: Prepare APK asset
        run: |
          mkdir -p frontend/release-artifacts
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "frontend/release-artifacts/kikoto-${KIKOTO_VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kikoto-android-apk
          path: frontend/release-artifacts/*.apk
          if-no-files-found: error

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    needs:
      - verify_release
      - build_and_push
      - build_apk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kikoto-android-apk
          path: release-artifacts

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIKOTO_VERSION_NAME: ${{ needs.verify_release.outputs.version_name }}
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi
          gh release upload "$GITHUB_REF_NAME" "release-artifacts/kikoto-${KIKOTO_VERSION_NAME}.apk" --repo "$GITHUB_REPOSITORY" --clobber
