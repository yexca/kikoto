name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: kikoto

jobs:
  verify_release:
    name: Verify release source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag and version
        id: version
        shell: bash
        run: |
          expected_version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $expected_version." >&2
            exit 1
          fi
          echo "version_name=${expected_version#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release notes
        shell: bash
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi

      - name: Wait for successful main CI for this commit
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100"
          deadline=$((SECONDS + 1800))

          while true; do
            # The single-quoted program contains jq variables, not shell variables.
            # shellcheck disable=SC2016
            state="$(gh api "$runs_api" --jq '
              [.workflow_runs[] | select(.head_branch == "main")] as $runs
              | if any($runs[]; .status == "completed" and .conclusion == "success") then "success"
                elif any($runs[]; .status != "completed") then "waiting"
                elif ($runs | length) > 0 then "failed"
                else "missing"
                end
            ')"

            case "$state" in
              success)
                echo "Successful main CI found for commit $GITHUB_SHA."
                break
                ;;
              failed)
                echo "Main CI failed for commit $GITHUB_SHA:" >&2
                gh api "$runs_api" --jq '
                  .workflow_runs[]
                  | select(.head_branch == "main")
                  | "\(.html_url) status=\(.status) conclusion=\(.conclusion)"
                ' >&2
                exit 1
                ;;
              waiting)
                echo "Main CI for commit $GITHUB_SHA is still running; checking again in 60 seconds."
                ;;
              missing)
                echo "Main CI for commit $GITHUB_SHA is not visible yet; checking again in 60 seconds."
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for successful main CI for commit $GITHUB_SHA." >&2
              exit 1
            fi
            sleep 60
          done

  build_image:
    name: Build image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - verify_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build without pushing so a broken image stops the release before any
      # registry tag moves. The push job reuses this cache.
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          cache-to: type=gha,scope=release-image,mode=max

  build_apk:
    name: Build and upload APK
    runs-on: ubuntu-24.04
    needs:
      - verify_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set release version
        run: |
          echo "KIKOTO_VERSION_NAME=${{ needs.verify_release.outputs.version_name }}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --strict-allow-scripts

      - name: Sync Android web assets
        working-directory: frontend
        run: npm run cap:sync

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets are required for release APK signing." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kikoto-release.keystore"
          echo "KIKOTO_KEYSTORE_FILE=$RUNNER_TEMP/kikoto-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          KIKOTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIKOTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIKOTO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --dependency-verification strict assembleRelease

      - name: Prepare APK asset
        run: |
          mkdir -p frontend/release-artifacts
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "frontend/release-artifacts/kikoto-${KIKOTO_VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kikoto-android-apk
          path: frontend/release-artifacts/*.apk
          if-no-files-found: error

  build_ipa:
    name: Build and upload IPA
    runs-on: macos-26
    needs:
      - verify_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Show Xcode version
        run: xcodebuild -version

      # The IPA is unsigned; sideloading tools re-sign it with the installing
      # user's identity, so no Apple signing secrets are involved.
      - name: Build unsigned IPA
        run: make ios-build

      - name: Prepare IPA asset
        env:
          KIKOTO_VERSION_NAME: ${{ needs.verify_release.outputs.version_name }}
        run: |
          mkdir -p frontend/release-artifacts
          cp "frontend/ios/App/build/kikoto-${GITHUB_REF_NAME}-unsigned.ipa" "frontend/release-artifacts/kikoto-${KIKOTO_VERSION_NAME}-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kikoto-ios-ipa
          path: frontend/release-artifacts/*.ipa
          if-no-files-found: error

  draft_release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - verify_release
      - build_image
      - build_apk
      - build_ipa

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kikoto-android-apk
          path: release-artifacts

      - name: Download IPA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kikoto-ios-ipa
          path: release-artifacts

      # A draft is invisible to the unauthenticated Releases API that update
      # checks read, so users are not offered this version until the image is
      # pushed and the release is published below.
      - name: Create or update draft release with APK and IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIKOTO_VERSION_NAME: ${{ needs.verify_release.outputs.version_name }}
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          apk="release-artifacts/kikoto-${KIKOTO_VERSION_NAME}.apk"
          ipa="release-artifacts/kikoto-${KIKOTO_VERSION_NAME}-unsigned.ipa"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
            gh release upload "$GITHUB_REF_NAME" "$apk" "$ipa" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$ipa" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi

  push_image:
    name: Push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs:
      - draft_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Kikoto
            org.opencontainers.image.description=Local-first personal audio library

      - name: Build and push production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          provenance: mode=max
          sbom: true

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - push_image

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
