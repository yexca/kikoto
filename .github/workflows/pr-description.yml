name: PR Description

on:
  pull_request_target:
    branches: [main]
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
      ]

permissions:
  contents: read

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: PR Description
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Run only trusted base code; the PR body is read as JSON data.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Check required description
        run: make pr-description-check
