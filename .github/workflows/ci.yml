name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      run_builds:
        description: Require Android, iOS, and Docker build validation for reusable calls.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Only a pull request's superseded run is cancelled. Every other commit gets
# its own group: a shared group would also drop a queued run when a newer one
# arrives, and the commit a release tags must keep a concluded result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      e2e: ${{ steps.plan.outputs.e2e }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      production: ${{ steps.plan.outputs.production }}
      dev_smoke: ${{ steps.plan.outputs.dev_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
      - name: Cache workflow lint build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('Makefile') }}
          restore-keys: actionlint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Run style and CI policy checks
        run: make ci-style
      - name: Select required validation
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_RUN_BUILDS: ${{ inputs.run_builds || false }}
        run: make ci-plan

  backend:
    name: Backend (${{ matrix.check }})
    needs: style
    if: needs.style.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [static, coverage, race]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
      - name: Restore Go modules and tool dependencies
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'Makefile') }}
          restore-keys: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Cache Go compilation and lint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.check }}-${{ hashFiles('backend/**/*.go', 'backend/**/*.sql', 'backend/go.mod', 'backend/go.sum', 'scripts/*.go', 'scripts/golangci-lint.yml', 'Makefile') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.check }}-
      - name: Run backend checks
        run: make ci-backend-${{ matrix.check }}
      - name: Save Go modules from one matrix job
        if: matrix.check == 'static' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Upload backend coverage
        if: always() && matrix.check == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend
    needs: style
    if: needs.style.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Run frontend core checks
        run: make ci-frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  dev-smoke:
    name: Development Compose
    needs: style
    if: needs.style.outputs.dev_smoke == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Run development Compose smoke
        run: make smoke
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-artifacts
          path: frontend/test-results
          if-no-files-found: ignore

  full-e2e:
    name: Full E2E (${{ matrix.shard }}/2)
    needs: style
    if: needs.style.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Run browser regression shard
        run: make E2E_ARGS="--shard=${{ matrix.shard }}/2" frontend-e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-e2e-artifacts-${{ matrix.shard }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

  android:
    name: Android build
    needs: style
    if: needs.style.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android
      - name: Run Android JVM tests and build debug APK
        run: make android-test android-build

  ios:
    name: iOS build
    needs: style
    if: needs.style.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned IPA
        run: make ios-build

  smoke:
    name: Smoke
    needs: style
    if: needs.style.outputs.production == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Cache production image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kikoto-buildx-cache
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', '.dockerignore', 'VERSION', 'LICENSE', 'backend/**', 'frontend/**') }}
          restore-keys: docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production image
        run: >-
          make DOCKER_IMAGE=kikoto:ci DOCKER_BUILD="docker buildx build"
          DOCKER_BUILD_ARGS="--load --cache-from type=local,src=$RUNNER_TEMP/kikoto-buildx-cache --cache-to type=local,dest=$RUNNER_TEMP/kikoto-buildx-cache-next,mode=max"
          docker-build
      - name: Replace exported layer cache
        run: |
          rm -rf -- "$RUNNER_TEMP/kikoto-buildx-cache"
          mv -- "$RUNNER_TEMP/kikoto-buildx-cache-next" "$RUNNER_TEMP/kikoto-buildx-cache"
      - name: Exercise the production image
        run: make DOCKER_IMAGE=kikoto:ci production-e2e

  # The check required to merge: it waits only for the jobs ci-plan.mjs marks
  # as core, so a slower platform or browser job never holds a merge.
  core:
    name: Core
    if: always()
    needs: [style, backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Verify the validation required to merge
        env:
          CI_PLAN: ${{ needs.style.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: make CI_GATE=core ci-results

  # Fails the run, and so blocks a release, unless every planned job succeeded;
  # only the plan may authorize a skipped job.
  complete:
    name: Complete
    if: always()
    needs: [style, backend, frontend, smoke, full-e2e, android, ios, dev-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Verify all planned validation results
        env:
          CI_PLAN: ${{ needs.style.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: make CI_GATE=complete ci-results
