<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="application-name" content="Kikoto" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/kikoto-icon.svg" />
    <link rel="apple-touch-icon" href="/kikoto-icon-192.png" />
    <script>
      (() => {
        const mode = localStorage.getItem("kikoto:theme") || "system";
        const storedAccent = localStorage.getItem("kikoto:theme-accent");
        const accent =
          storedAccent === "pink" || storedAccent === "blue" || storedAccent === "green" ? storedAccent : "blue";
        const dark =
          mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.themeAccent = accent;
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0f1115" : "#f5f6f8";
      })();
    </script>
    <title>Kikoto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
